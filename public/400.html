<!doctype html>
<html lang="tr">
  <head>
    <title>Geçersiz istek (400) · DestekAkış</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px; line-height: 1.5; color: #101828;
        background: radial-gradient(1200px 500px at 50% -10%, #e6f6f4 0%, rgba(230, 246, 244, 0) 70%), #f5f6f8;
      }
      main { width: 100%; max-width: 440px; text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
      .brand div span { color: #0f766e; }
      .mark { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #0f766e; color: #fff; }
      .card { padding: 32px; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08); }
      .code { display: inline-block; margin-bottom: 12px; padding: 2px 10px; border-radius: 999px; background: #f0fdfa; color: #0f766e; font-size: 13px; font-weight: 600; }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0; color: #667085; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; margin-top: 24px; padding: 0 16px;
          border-radius: 8px; background: #0f766e; color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #115e59; }
      a:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.28); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>
        <div>Destek<span>Akış</span></div>
      </div>
      <div class="card">
        <div class="code">Hata 400</div>
        <h1>Geçersiz istek</h1>
        <p>Sunucu bu isteği işleyemedi. Lütfen sayfayı yenileyip tekrar dene.</p>
        <a href="/">Ana sayfaya dön</a>
      </div>
    </main>
  </body>
</html>
